name: Publish @motorical/mcp

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/motorical-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high

      - name: Verify this version isn't already published
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @motorical/mcp version 2>/dev/null || echo "none")
          echo "package.json version: $LOCAL_VERSION"
          echo "currently published version: $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "::error::Version $LOCAL_VERSION is already published. Bump packages/motorical-mcp/package.json's version before running this workflow."
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance
