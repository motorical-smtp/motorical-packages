name: Publish motorical (Python SDK) to PyPI

# Least-privilege, like the npm workflows: the verify job runs the tests and builds the distributions with NO
# credential; only the publish job gets the OIDC token (PyPI trusted publishing, no stored API token), checks out
# nothing, and uploads the exact files the verify job built.
#
# FIRST RELEASE: on pypi.org the owner adds a PENDING trusted publisher for project "motorical" (owner
# motorical-smtp, repository motorical-packages, workflow publish-motorical-sdk-python.yml, environment pypi).
# The first successful run then creates the project. A pending publisher does not reserve the name until that run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run tests and build the distributions without uploading.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/motorical-sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tests (every operation against a local server)
        run: python -m unittest discover -s tests -v

      - name: Verify this version isn't already on PyPI
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('motorical/__init__.py').read()).group(1))")
          echo "pyproject version: $VERSION, __version__: $INIT"
          test "$VERSION" = "$INIT" || { echo "::error::pyproject.toml and motorical/__init__.py disagree"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/motorical/$VERSION/json")
          if [ "$CODE" = "200" ]; then echo "::error::motorical $VERSION is already on PyPI. Bump the version first."; exit 1; fi

      # Build tools pinned to exact versions, installed only in this credential-free job.
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1 twine==6.1.0
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m twine check --strict "$RUNNER_TEMP"/dist/*
          ls -l "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motorical-python-dist
          path: ${{ runner.temp }}/dist/*
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: motorical-python-dist
          path: dist

      - name: Upload to PyPI (trusted publishing, attestations on)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
